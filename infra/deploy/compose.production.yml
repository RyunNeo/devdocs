services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the Baota .env field}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the Baota .env field}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Baota .env field}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: devdocs-prod-api:local
    pull_policy: never
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: devdocs-prod-api:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/deploy/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}"
      UPLOAD_DIR: /data/uploads
      COOKIE_NAME: devdocs_prod_session
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in the Baota .env field}"]'
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-50}
      DAILY_INDEX_LIMIT: ${DAILY_INDEX_LIMIT:-20}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: devdocs-prod-web:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: devdocs_prod_session
    ports:
      - "80:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(5000), redirect: 'manual'}).then(r => { if (r.status !== 200) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 7s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uploads:
